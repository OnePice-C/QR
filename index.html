<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💕 Bí Mật Của Anh 💕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html, body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Quicksand',sans-serif;}
  
  /* CANVAS TRÁI TIM 3D SIÊU LỘNG LẪY */
  canvas{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    opacity: 0.95;
    filter: drop-shadow(0 0 25px rgba(255, 20, 147, 0.95)) drop-shadow(0 0 50px rgba(255, 105, 180, 0.8));
  }
  
  /* KHUNG CHỮ: TỰ TỐI ƯU CHO CẢ MOBILE VÀ PC */
  .center-stage {
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    max-width: 900px;
    text-align: center;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(circle, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0) 100%);
    padding: 20px 10px;
    border-radius: 40px;
  }

  /* CHỮ TỎ TÌNH: TỰ ĐỘNG THU NHỎ TRÊN ĐIỆN THOẠI ĐỂ LỌT LÒNG TRÁI TIM */
  .typing-text {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(28px, 7.5vw, 85px); /* Đã giảm min-size từ 50px xuống 28px để vừa màn hình dọc */
    font-weight: 700;
    line-height: 1.25;
    color: #fff;
    text-shadow: 0 0 20px #ff1493, 0 0 40px #ff69b4, 0 0 70px #ffffff, 0 0 90px #ff1493;
    min-height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: pre-line;
  }

  .typing-text::after {
    content: '|';
    animation: blink 0.7s infinite;
    color: #ff6ec7;
    margin-left: 6px;
  }

  .typing-text.finished::after {
    display: none;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* SOURCE CODE CHẠY FULL SCREEN */
  .code-scroll {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 5;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    opacity: 0.45;
  }
  
  .code-scroll .code-inner {
    display: flex;
    justify-content: space-between;
    width: 100vw;
    animation: scrollCode 38s linear infinite;
  }
  
  @keyframes scrollCode {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  
  .code-scroll pre {
    font-family: 'Courier New', monospace;
    font-size: clamp(10px, 1.2vw, 14px);
    line-height: 1.5;
    white-space: pre;
    padding: 0 10px;
    margin: 0;
    flex: 1;
    color: rgba(0, 255, 170, 0.45);
  }
  
  .code-scroll pre .kw { color: rgba(255, 120, 210, 0.85); }
  .code-scroll pre .fn { color: rgba(120, 220, 255, 0.85); }
  .code-scroll pre .cm { color: rgba(160, 160, 160, 0.5); font-style: italic; }
  .code-scroll pre .st { color: rgba(255, 230, 130, 0.85); }
  .code-scroll pre .nb { color: rgba(230, 170, 255, 0.85); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Matrix Source Code Full Screen -->
<div class="code-scroll">
  <div class="code-inner" id="codeInner"></div>
</div>

<!-- Khung chữ chính giữa trái tim -->
<div class="center-stage">
  <div class="typing-text" id="typingText"></div>
</div>

<script>
// --- CHẠY CÂU THOẠI TỎ TÌNH ---
const scriptMessages = [
  "Anh muốn tiến\nxa hơn",
  "Trong mối\nquan hệ này",
  "Anh muốn yêu\nem nghiêm túc.",
  "Em đồng ý...",
  "Làm người\nyêu anh nha"
];

const typingText = document.getElementById('typingText');
let msgIndex = 0;
let charIndex = 0;

function typeNextChar() {
  const currentMsg = scriptMessages[msgIndex];
  
  if (charIndex < currentMsg.length) {
    typingText.textContent += currentMsg.charAt(charIndex);
    charIndex++;
    setTimeout(typeNextChar, 65);
  } else {
    setTimeout(eraseAndNext, 1800);
  }
}

function eraseAndNext() {
  msgIndex++;
  if (msgIndex < scriptMessages.length) {
    typingText.textContent = '';
    charIndex = 0;
    typeNextChar();
  } else {
    typingText.classList.add('finished');
  }
}

setTimeout(typeNextChar, 1000);

// =========================================================
// TRÁI TIM 3D SIÊU LỘNG LẪY (THÍCH ỨNG TỈ LỆ MOBILE & PC)
// =========================================================
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, cx, cy, sc;

function resize(){
  W = c.width = window.innerWidth; 
  H = c.height = window.innerHeight;
  cx = W / 2; 
  
  // Tự động điều chỉnh kích thước trái tim dựa vào màn hình dọc (Mobile) hay ngang (PC)
  if (W < H) {
    sc = W / 38; // Tăng tỉ lệ trái tim trên điện thoại lên to hơn
    cy = H / 2 - H * 0.03;
  } else {
    sc = Math.min(W, H) / 52;
    cy = H / 2 + H * 0.01;
  }
}
resize(); 
window.addEventListener('resize', resize);

const PI2 = Math.PI * 2;
let time = 0;

function hx(t){return 16*Math.sin(t)**3}
function hy(t){return -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))-6}

// Border Sparks
class HeartBorderSpark {
  constructor(){
    this.t = Math.random()*PI2;
    this.size = 1.2 + Math.random()*2.8;
    this.hue = 320 + Math.random()*50;
    this.sparkle = Math.random()*PI2;
    this.sparkleSpeed = 0.05 + Math.random()*0.1;
  }
  update(){
    this.sparkle += this.sparkleSpeed;
    this.t += 0.002;
    if(this.t > PI2) this.t -= PI2;
  }
  draw(beat){
    let x = cx + (hx(this.t) + Math.sin(this.sparkle)*0.3)*sc*beat;
    let y = cy + (hy(this.t) + Math.cos(this.sparkle)*0.3)*sc*beat;
    let alpha = 0.5 + 0.5*Math.sin(this.sparkle);
    let radius = this.size * (0.8 + 0.4*Math.sin(this.sparkle));

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, PI2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${alpha})`;
    ctx.fill();

    if(Math.random() < 0.08) {
      ctx.beginPath();
      ctx.moveTo(x-radius*2.5, y); ctx.lineTo(x+radius*2.5, y);
      ctx.moveTo(x, y-radius*2.5); ctx.lineTo(x, y+radius*2.5);
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 90%, ${alpha*0.8})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
}

// Flowing Streams
class StreamParticle {
  constructor(stream){
    this.stream = stream;
    this.t = Math.random()*PI2;
    this.speed = 0.008 + Math.random()*0.006;
    this.dir = stream % 2 === 0 ? 1 : -1;
    this.trail = [];
    this.maxTrail = 30;
    this.size = 2.0 + Math.random()*2.5;
    this.offset = (Math.random()-0.5)*2.2;
    this.hueBase = stream * 18;
  }
  update(){
    this.t += this.speed * this.dir;
    if(this.t > PI2) this.t -= PI2;
    if(this.t < 0) this.t += PI2;
    let x = cx + (hx(this.t)+this.offset)*sc;
    let y = cy + (hy(this.t)+this.offset*0.3)*sc;
    this.trail.unshift({x,y});
    if(this.trail.length > this.maxTrail) this.trail.pop();
  }
  draw(){
    let hue = (310 + this.hueBase + time*0.5) % 360;
    for(let i=0; i<this.trail.length; i++){
      let p = this.trail[i];
      let a = (1 - i/this.trail.length);
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.size*a, 0, PI2);
      ctx.fillStyle = `hsla(${hue},100%,${70+a*25}%,${a*0.95})`;
      ctx.fill();
    }
  }
}

// Spiral Particles
class SpiralParticle {
  constructor(){this.reset()}
  reset(){
    this.angle = Math.random()*PI2;
    this.radius = 28 + Math.random()*15;
    this.targetRadius = 1 + Math.random()*4;
    this.speed = 0.005 + Math.random()*0.006;
    this.shrink = 0.022;
    this.size = 1.5 + Math.random()*2.2;
    this.hue = 280 + Math.random()*90;
  }
  update(){
    this.angle += this.speed;
    this.radius -= this.shrink;
    if(this.radius <= this.targetRadius) this.reset();
  }
  draw(){
    let x = cx + Math.cos(this.angle)*this.radius*sc;
    let y = cy + Math.sin(this.angle)*this.radius*sc*0.85;
    ctx.beginPath();
    ctx.arc(x, y, this.size, 0, PI2);
    ctx.fillStyle = `hsla(${this.hue},100%,80%,0.95)`;
    ctx.fill();
  }
}

// Light Orbs
class LightOrb {
  constructor(){
    this.angle = Math.random()*PI2;
    this.dist = 8 + Math.random()*16;
    this.speed = 0.003 + Math.random()*0.005;
    this.size = 5 + Math.random()*7;
    this.hue = 300 + Math.random()*60;
  }
  update(){ this.angle += this.speed; }
  draw(){
    let x = cx + Math.cos(this.angle)*this.dist*sc;
    let y = cy + Math.sin(this.angle)*this.dist*sc*0.7;
    let grd = ctx.createRadialGradient(x,y,0,x,y,this.size);
    grd.addColorStop(0, `hsla(${this.hue},100%,90%,0.75)`);
    grd.addColorStop(1, `hsla(${this.hue},100%,50%,0)`);
    ctx.fillStyle = grd; ctx.fillRect(x-this.size, y-this.size, this.size*2, this.size*2);
  }
}

// Rising Dust
class RisingDust {
  constructor(){this.reset(true)}
  reset(init){
    let t = Math.random()*PI2;
    this.x = cx + hx(t)*sc*(0.2+Math.random()*0.8);
    this.y = init ? cy + hy(t)*sc*(0.2+Math.random()*0.8) : cy + 16*sc;
    this.vy = -(0.4 + Math.random()*0.7);
    this.size = 1.0 + Math.random()*2.0;
    this.life = 90 + Math.random()*90;
    this.age = init ? Math.random()*this.life : 0;
    this.hue = 320 + Math.random()*50;
  }
  update(){ this.age++; this.y += this.vy; if(this.age>=this.life) this.reset(false); }
  draw(){
    let a = (1 - this.age/this.life);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, PI2);
    ctx.fillStyle = `hsla(${this.hue},100%,85%,${a*0.9})`; ctx.fill();
  }
}

// Rain Hearts
class RainHeart {
  constructor(delay){
    this.delay = delay;
    this.t = Math.random()*PI2;
    this.fill = 0.15 + Math.random()*0.85;
    this.reset();
  }
  reset(){
    this.x = Math.random()*W;
    this.y = -Math.random()*H*0.5 - 20;
    this.tx = cx + hx(this.t)*sc*this.fill;
    this.ty = cy + hy(this.t)*sc*this.fill;
    this.state = 'waiting';
    this.timer = this.delay;
    this.size = 1.2 + Math.random()*2.2;
    this.hue = 315 + Math.random()*50;
    this.speed = 3.0 + Math.random()*4.0;
  }
  update(){
    if(this.state==='waiting'){ this.timer--; if(this.timer<=0) this.state='falling'; return; }
    if(this.state==='falling'){
      this.y += this.speed;
      if(this.y > this.ty - H*0.4) this.state = 'forming';
    }
    if(this.state==='forming'){
      this.x += (this.tx - this.x)*0.045; this.y += (this.ty - this.y)*0.045;
    }
  }
  draw(){
    if(this.state==='waiting') return;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, PI2);
    ctx.fillStyle = `hsla(${this.hue},100%,80%,0.9)`; ctx.fill();
  }
}

const borderSparks = []; for(let i=0; i<450; i++) borderSparks.push(new HeartBorderSpark());
const streams = []; for(let s=0;s<12;s++) for(let i=0;i<8;i++) streams.push(new StreamParticle(s));
const spirals = []; for(let i=0;i<120;i++) spirals.push(new SpiralParticle());
const orbs = []; for(let i=0;i<20;i++) orbs.push(new LightOrb());
const dusts = []; for(let i=0;i<150;i++) dusts.push(new RisingDust());
const rainHearts = []; for(let i=0;i<700;i++) rainHearts.push(new RainHeart(Math.floor(i*0.35)));

function draw(){
  time++;
  let beat = 1 + 0.055*Math.sin(time*0.045)**2;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';
  for(let r of rainHearts){ r.update(); r.draw(); }
  for(let s of spirals){ s.update(); s.draw(); }
  for(let o of orbs){ o.update(); o.draw(); }
  for(let b of borderSparks){ b.update(); b.draw(beat); }
  for(let d of dusts){ d.update(); d.draw(); }
  for(let s of streams){ s.update(); s.draw(); }

  requestAnimationFrame(draw);
}
draw();

// =========================================================
// SOURCE CODE SCROLLING FULL SCREEN
// =========================================================
const codeCol1 = `<span class="cm">// === AI NEURAL NETWORK ENGINE ===</span>
<span class="kw">import</span> torch
<span class="kw">import</span> torch.nn <span class="kw">as</span> nn

<span class="kw">class</span> <span class="fn">QuantumLoveCore</span>(nn.Module):
    <span class="kw">def</span> <span class="fn">__init__</span>(self):
        super().<span class="fn">__init__</span>()
        self.encoder = nn.<span class="fn">Linear</span>(<span class="nb">2048</span>, <span class="nb">8192</span>)
        self.attn = nn.<span class="fn">MultiheadAttention</span>(<span class="nb">8192</span>, <span class="nb">16</span>)
        self.decoder = nn.<span class="fn">Linear</span>(<span class="nb">8192</span>, <span class="nb">Infinity</span>)

    <span class="kw">def</span> <span class="fn">forward</span>(self, heart_signal):
        x = self.encoder(heart_signal)
        attn_out, _ = self.attn(x, x, x)
        <span class="kw">return</span> self.decoder(attn_out)
`;

const codeCol2 = `<span class="cm">// === GLSL SHADER: CORE HEART BEAM ===</span>
<span class="kw">precision</span> highp float;
<span class="kw">uniform</span> vec2 u_resolution;
<span class="kw">uniform</span> float u_time;

<span class="kw">void</span> <span class="fn">main</span>() {
    vec2 st = gl_FragCoord.xy / u_resolution.xy;
    vec3 color = vec3(<span class="nb">0.0</span>);
    float d = <span class="fn">length</span>(st - vec2(<span class="nb">0.5</span>));
    color += <span class="fn">vec3</span>(<span class="nb">1.0</span>, <span class="nb">0.1</span>, <span class="nb">0.5</span>) * <span class="fn">smoothstep</span>(<span class="nb">0.5</span>, <span class="nb">0.0</span>, d);
    gl_FragColor = <span class="fn">vec4</span>(color, <span class="nb">1.0</span>);
}
`;

const codeCol3 = `<span class="cm">// === AES-256 HIGH SECURITY ENCRYPTION ===</span>
<span class="kw">async function</span> <span class="fn">lockHeartProtocol</span>(user) {
    <span class="kw">const</span> key = <span class="kw">await</span> crypto.subtle.<span class="fn">generateKey</span>(
        { name: <span class="st">"AES-GCM"</span>, length: <span class="nb">256</span> }, <span class="kw">true</span>, [<span class="st">"encrypt"</span>]
    );
    <span class="kw">return</span> <span class="st">"HEART_ENCRYPTED_FOREVER"</span>;
}
<span class="cm">// === CONFESSION INJECTOR ===</span>
<span class="kw">const</span> status = <span class="st">"ACCEPTED"</span>;
console.<span class="fn">log</span>(<span class="st">\`Status: \${status}\`</span>);
`;

const codeInner = document.getElementById('codeInner');
codeInner.innerHTML = `
  <pre>${codeCol1}<br>${codeCol1}</pre>
  <pre>${codeCol2}<br>${codeCol2}</pre>
  <pre>${codeCol3}<br>${codeCol3}</pre>
`;
</script>
</body>
</html>
